name: Deploy to DigitalOcean via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build e Push da imagem para o Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meuapp:latest -f docker/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/meuapp:latest

      - name: 🚀 Copiar arquivos para o Droplet
        run: |
          echo "${{ secrets.SSH_KEY }}" > ssh_key
          chmod 600 ssh_key

          # cria o diretório remoto se não existir
          ssh -i ssh_key -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} "mkdir -p /opt/meuapp/docker"

          # envia os arquivos
          rsync -avz -e "ssh -i ssh_key -o StrictHostKeyChecking=no" docker-compose-prod.yml \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/meuapp/

          rsync -avz -e "ssh -i ssh_key -o StrictHostKeyChecking=no" docker/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/meuapp/docker/

          rm ssh_key

      - name: 🧠 Deploy no Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/meuapp

            echo "📦 Atualizando containers..."

            # cria .env se não existir
            if [ ! -f .env ]; then
              echo "🧾 Criando arquivo .env..."
              cat > .env <<EOF
              APP_NAME=Laravel
              APP_ENV=production
              APP_KEY=
              APP_DEBUG=false
              APP_URL=http://seu-dominio.com

              DB_CONNECTION=mysql
              DB_HOST=db
              DB_PORT=3306
              DB_DATABASE=laravel
              DB_USERNAME=username
              DB_PASSWORD=userpass

              REDIS_HOST=redis
              REDIS_PASSWORD=null
              REDIS_PORT=6379

              DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
              EOF
              fi

              # Pull da imagem mais recente e restart dos containers
              docker compose -f docker-compose-prod.yml pull
              docker compose -f docker-compose-prod.yml down
              docker compose -f docker-compose-prod.yml up -d

              echo "⏳ Aguardando inicialização..."
              sleep 15

              echo "🔧 Executando comandos Laravel..."
              docker compose -f docker-compose-prod.yml exec -T app php artisan key:generate --force || true
              docker compose -f docker-compose-prod.yml exec -T app php artisan storage:link || true
              docker compose -f docker-compose-prod.yml exec -T app php artisan migrate --force || true
              docker compose -f docker-compose-prod.yml exec -T app php artisan config:cache || true
              docker compose -f docker-compose-prod.yml exec -T app php artisan route:cache || true
              docker compose -f docker-compose-prod.yml exec -T app php artisan view:cache || true

              echo "✅ Deploy concluído com sucesso!"

      - name: 🩺 Verificar saúde da aplicação
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/meuapp
            echo "=== Status dos containers ==="
            docker compose -f docker-compose-prod.yml ps
            echo ""
            echo "=== Logs recentes do app ==="
            docker compose -f docker-compose-prod.yml logs --tail=20 app || true
            echo ""
            echo "=== Logs recentes do nginx ==="
            docker compose -f docker-compose-prod.yml logs --tail=20 nginx || true
            echo ""
            echo "=== Teste HTTP local ==="
            curl -fsS http://localhost || echo "⚠️ Aplicação pode não estar respondendo ainda"

      - name: 🧹 Limpar imagens antigas
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker image prune -af --filter "until=24h"
