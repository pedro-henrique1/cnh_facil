name: Deploy to DigitalOcean via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meuapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/meuapp:latest

      - name: Deploy arquivos via rsync
        run: |
          echo "${{ secrets.SSH_KEY }}" > ssh_key
          chmod 600 ssh_key

          # Copiar docker-compose.yml
          rsync -avz -e "ssh -i ssh_key -o StrictHostKeyChecking=no" \
            docker-compose.yml \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/meuapp/

          # Copiar pasta docker/
          rsync -avz -e "ssh -i ssh_key -o StrictHostKeyChecking=no" \
            docker/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/meuapp/docker/

          rm ssh_key

      - name: Deploy na Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/meuapp

            # Verificar se arquivo foi copiado
            if [ ! -f docker-compose.yml ]; then
              echo "❌ ERRO: docker-compose.yml não foi copiado!"
              exit 1
            fi

            # Modificar para usar imagem do Docker Hub
            sed -i 's/build:/# build:/g' docker-compose.yml
            sed -i 's/context: \./# context: \./g' docker-compose.yml
            sed -i 's/dockerfile: Dockerfile/# dockerfile: Dockerfile/g' docker-compose.yml
            sed -i '/# build:/a\        image: ${{ secrets.DOCKER_USERNAME }}/meuapp:latest' docker-compose.yml

            # Criar .env se não existir
            if [ ! -f .env ]; then
              cat > .env <<'EOF'
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=
            APP_DEBUG=false
            APP_URL=http://seu-dominio.com

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=laravel
            DB_USERNAME=username
            DB_PASSWORD=userpass

            REDIS_HOST=redis
            REDIS_PASSWORD=null
            REDIS_PORT=6379

            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            EOF
            fi

            # Pull da nova imagem
            echo "📦 Baixando nova imagem..."
            docker compose pull app

            # Restart dos containers
            echo "🔄 Reiniciando containers..."
            docker compose down
            docker compose up -d app

            # Copiar código do container para o volume compartilhado
            echo "📋 Copiando código para volume compartilhado..."
            sleep 5
            CONTAINER_ID=$(docker compose ps -q app)
            docker cp $CONTAINER_ID:/var/www/. /tmp/laravel-code/
            docker run --rm -v meuapp_code-volume:/target -v /tmp/laravel-code:/source alpine sh -c "cp -r /source/. /target/"
            rm -rf /tmp/laravel-code

            # Subir todos os containers
            docker compose up -d

            # Aguardar containers iniciarem
            echo "⏳ Aguardando containers iniciarem..."
            sleep 15

            # Executar comandos Laravel
            echo "🔧 Executando comandos do Laravel..."
            docker compose exec -T app php artisan key:generate --force || true
            docker compose exec -T app php artisan storage:link || true
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            echo "✅ Deploy concluído!"

      - name: Verificar saúde da aplicação
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/meuapp
            echo "=== Status dos containers ==="
            docker compose ps
            echo ""
            echo "=== Últimos logs do app ==="
            docker compose logs --tail=20 app
            echo ""
            echo "=== Últimos logs do nginx ==="
            docker compose logs --tail=20 nginx

      - name: Limpar imagens antigas
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker image prune -af --filter "until=24h"
