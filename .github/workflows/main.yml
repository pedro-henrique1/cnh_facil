name: Deploy to DigitalOcean via DOCR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no DOCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCR_REGISTRY }}
          username: do
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Build e push da imagem Docker
        run: |
          docker build -t ${{ secrets.DOCR_REGISTRY }}/appcontainer:latest .
          docker push ${{ secrets.DOCR_REGISTRY }}/appcontainer:latest

      - name: Deploy na Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCR_REGISTRY }}/meuapp:latest
            docker stop meuapp || true
            docker rm meuapp || true
            docker run -d --name meuapp -p 80:8080 ${{ secrets.DOCR_REGISTRY }}/meuapp:latest
