name: Deploy to DigitalOcean via Docker Hub

on:
  push:
    branches:
     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          # O registro do Docker Hub é 'docker.io' (ou pode ser omitido, mas é bom ser explícito)
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }} # Seu novo segredo
          password: ${{ secrets.DOCKER_PASSWORD }} # Seu novo segredo (PAT)

      - name: Build e push da imagem Docker
        run: |
          # Agora a imagem é nomeada como: seuusuario/meuapp:latest
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meuapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/meuapp:latest

      - name: Deploy na Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # O pull agora usa a imagem do Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/meuapp:latest
            docker stop meuapp || true
            docker rm meuapp || true
            docker run -d --name meuapp -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/meuapp:latest
