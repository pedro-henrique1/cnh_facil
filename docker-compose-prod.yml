version: '3.8'

services:
  # App (Laravel + PHP)
  app:
    image: ${DOCKER_USERNAME}/meuapp:latest
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      - redis
      - db
    networks:
      - laravel
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-username}
      DB_PASSWORD: ${DB_PASSWORD:-userpass}
      REDIS_HOST: redis
    volumes:
      - code-volume:/var/www
      # se sua imagem já contém o código (copiado no Dockerfile), pode remover o volume acima

  # Nginx (proxy reverso)
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - code-volume:/var/www:ro
      - ./docker/nginx/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - laravel

  # MySQL
  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-userpass}
      MYSQL_USER: ${DB_USERNAME:-username}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - laravel

  # Redis
  redis:
    image: redis:latest
    container_name: laravel-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  code-volume:
